name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got. Error messages help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Gatewyn version
      description: The image tag in your compose file, for example 1.5.3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (optional)
      description: Remove any secret, token, password, private domain or IP address before pasting.
