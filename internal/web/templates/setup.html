{{define "content"}}<div class="auth-brand"><span class="brandmark"><svg viewBox="0 0 32 32" class="logo" aria-hidden="true"><path d="M5 28V14a11 11 0 0 1 22 0v14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M12 28V15a4 4 0 0 1 8 0v13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></span><span><b>Gatewyn</b><small>Passerelle HTTPS</small></span></div><div class="card auth-card"><header class="auth-head"><p class="eyebrow">Première configuration</p><h1>Bienvenue dans Gatewyn</h1><p class="muted">Choisissez un identifiant et un mot de passe pour le compte administrateur. Il n'y a pas de compte par défaut.</p></header><form method="post" action="/setup" class="form">
{{if .Error}}<div class="note" role="alert"><span class="pill err">Erreur</span> {{.Error}}</div>{{end}}
<label class="f">Identifiant<input class="t" type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="3" maxlength="32" autofocus><small>3 à 32 caractères : lettres, chiffres, point, tiret, tiret bas.</small></label>
<label class="f">Mot de passe<input class="t" type="password" name="password" autocomplete="new-password" required minlength="12"><small>12 caractères au moins. Une phrase courte convient très bien.</small></label>
<label class="f">Confirmer le mot de passe<input class="t" type="password" name="confirm" autocomplete="new-password" required minlength="12"></label>
<div class="actions"><button class="btn primary wide-btn" type="submit">Créer le compte <span>→</span></button></div></form></div>{{end}}
