{{define "content"}}<header class="top publish-head"><div><a class="back-link" href="/security/protection">← Protection CrowdSec</a><h1>{{.Heading}}</h1></div></header>
<div id="flash" aria-live="polite"></div>
<div class="card crowdsec-connect publish-main"><form method="post" action="/security/crowdsec{{if .Guided}}?appsec=1{{end}}" class="form" autocomplete="off">
{{if .Error}}<div class="note" role="alert"><span class="pill err">Erreur</span> {{.Error}}</div>{{end}}
<label class="f">Adresse CrowdSec<input class="t mono" name="url" value="{{.Name}}" placeholder="http://crowdsec:8080" autocapitalize="none" spellcheck="false" required{{if not .Guided}} autofocus{{end}}></label>
{{if .KeyAuto}}<div class="note"><span class="pill ok">OK</span> La clé a été créée par CrowdSec et trouvée par Gatewyn : rien à saisir.</div><input type="hidden" name="key" value="">
{{else}}<label class="f">Clé CrowdSec<input class="t mono" name="key" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" data-bwignore="true" data-1p-ignore{{if not .Editing}} required{{else}} placeholder="Inchangée (laisser vide)"{{end}}{{if .Guided}} autofocus{{end}}><small>Collez la clé affichée par <span class="mono">cscli bouncers add gatewyn</span>.</small></label>{{end}}
<label class="f">Adresse AppSec<input class="t mono" name="appsec_url" value="{{.AppSecURL}}" placeholder="Optionnel : http://crowdsec:7422" autocapitalize="none" spellcheck="false"></label>
<div class="switch"><label for="appsec_failopen"><b>Laisser passer si AppSec est indisponible</b></label><input type="checkbox" id="appsec_failopen" name="appsec_failopen" value="1"{{if .AppSecFailOpen}} checked{{end}}><label for="appsec_failopen" class="tog" aria-hidden="true"></label></div>
<div class="actions"><button class="btn primary" type="submit">{{.Submit}}</button></div></form></div>{{end}}
